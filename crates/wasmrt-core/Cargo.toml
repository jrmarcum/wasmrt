[package]
name = "wasmrt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "wasmrt runtime core (no_std-friendly): decode, validate, and interpret WebAssembly."
# crates.io listing metadata. `readme` must be a path INSIDE the package — cargo packages the
# file, so `../../README.md` is rejected; each crate carries its own short one.
readme = "README.md"
keywords = ["webassembly", "wasm", "runtime", "interpreter", "no-std"]
categories = ["wasm", "no-std", "development-tools"]

[features]
# `std` on by default for native builds. Turn it OFF for the freestanding wasm32
# build: `cargo build -p wasmrt-core --no-default-features --target wasm32-unknown-unknown`.
default = ["std"]
std = []

[lints]
workspace = true
